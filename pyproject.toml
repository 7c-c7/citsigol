[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citsigol"
version = "0.2.0"
description = "Citsigol is an investigatory package providing utilities for investigation and manipulation of the reversed logistic (citsigol) map."
readme = "README.rst"
authors = [
  {name = "Dustin Phillip Summy", email = "dustinsummy@gmail.com"}
]
maintainers = [
  {name = "Dustin Phillip Summy", email = "dustinsummy@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
license = {text = "MIT license"}
dependencies = [
     "numpy>=1.26.4",
     "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "coverage",   # test coverage
    "mypy",       # static type checking
    "pytest",     # test runner
    "ruff",       # lint + format
    "pre-commit", # git hooks
    "tox",        # multi-version test runner
    "sphinx",     # docs
    "twine",      # release upload
    "build",      # PEP 517 build frontend
]

[project.urls]

bugs = "https://github.com/7c-c7/citsigol/issues"
changelog = "https://github.com/7c-c7/citsigol/blob/official/HISTORY.rst"
homepage = "https://github.com/7c-c7/citsigol"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]




# Mypy
# ----

[tool.mypy]
files = "."
exclude = ['^build/', '^dist/', '^\.venv/']

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
